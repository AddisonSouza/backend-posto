# docker-compose.dev.yml
version: '3.9'
services:
  postgres:
    image: postgres:15
    container_name: postgres_dev
    environment:
      POSTGRES_USER: addiz
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: gasosa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
