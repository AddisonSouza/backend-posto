services:
  mysql:
    image: mysql:8.3.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: senha
      MYSQL_DATABASE: gasosa
      MYSQL_USER: addiz
      MYSQL_PASSWORD: senha
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psenha"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tomcat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tomcat_app
    ports:
      - "8090:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: gasosa
      DB_USER: addiz
      DB_PASS: senha
    networks:
      - backend_net
    restart: unless-stopped

volumes:
  mysqldata:

networks:
  backend_net:
    driver: bridge
